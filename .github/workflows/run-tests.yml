name: run-tests

on:
    push:
    pull_request:
        branches:
        - main

permissions:
    contents: read

jobs:
    run-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up python
              uses: actions/setup-python@v7
              with:
                python-version: "3.15"

            - name: Install dependencies
              run: python -m pip install -e . --group test

            - name: Run tests
              run: python -m pytest